dependencies:
  idf: '>=5.3'

  esp_video:
    version: 0.8.*
    public: true

  waveshare/esp32_p4_platform: '*'

  # ESP-DL reference backend
  espressif/esp-dl: ^3.3.5
  espressif/human_face_detect: ^0.4.2
  espressif/human_face_recognition: '*'

  # TensorFlow Lite Micro runtime used by both FP32 and full-INT8 backends.
  espressif/esp-tflite-micro: ^1.3.7

  # Optimized INT8 kernels used by the TFLM-INT8 backend on ESP32-P4.
  # The FP32 backend remains a separate non-ESP-NN comparison path.
  espressif/esp-nn: '>=1.1.1'
